








config-version: 8







models:
  catalog: ""
  codex-catalog: ""
  devin-catalog: ""


server:


  host: ""


  port: 8317




  max-request-body-bytes: 0





  response-compression:

    enabled: true

    min-bytes: 1024




  github-token: ""



  trusted-proxies: []






  tls:
    enable: false
    cert: ""
    key: ""


  commercial-mode: false








  discovery:
    enabled: false
















  kv-store:

    disabled: false

    path: ""


management:


  allow-remote: false




  secret-key: ""


  disable-control-panel: false










  panel-github-repository: "https://github.com/router-for-me/Cli-Proxy-API-Management-Center"


access:

  api-keys:
    - "your-api-key-1"
    - "your-api-key-2"
    - "your-api-key-3"





































routing:
  strategy: "round-robin"





















  reset-soonest:


    five-hour-guard-percent: 90
  quota-poller:




    enabled: true



    claude-interval: "30m"
    claude-min-gap: "10m"

    codex-interval: "5m"












  session-affinity: false

  session-affinity-ttl: "1h"










  session-affinity-subagents: true








  session-affinity-rebind-on: "any"


  force-model-prefix: false

  retry:










    request-retry: 3





    max-retry-credentials: 0




    max-retry-interval: 30

  cooldown:


    disable-cooling: false



    save-cooldown-status: false



    transient-error-cooldown-seconds: 0


requests:


  proxy-url: ""














  tls-handshake-timeout-seconds: 0



  passthrough-headers: false


  nonstream-keepalive-interval: 0














































































client:
  codex:


    enable-apply-patch: false






    optimize-multi-agent-v2: false


    web-search-result-cache:
      enabled: false
      ttl: "24h"
      limit: 1024

  claude:



    show-codex-commentary: false


upstream:
  codex:


    response-steering: false





    upstream-request-compression: false

    upstream-request-compression-min-bytes: 1024


    websocket-compression: true

    disable-codex-cloaking: false



    # generated event. Anything else, including a server-side tool item such as web_search_call and

















    # too, the delay now ends at the first generated token rather than at the first heartbeat. The











    # past the budget, until the first generated token. That is not specific to the budget: any frame










    stream-bootstrap-buffering: false

    # When set (e.g. "20s"), if the time ceiling is reached before the first generated token,















    stream-bootstrap-timeout: "0"





    orphan-delegation-compatibility: false



    model-level-cooling: false

  claude:


    model-level-cooling: false








    tool-search: false









    server-side-fallback: false







    session-date-pin-days: 7






    disable-claude-cloak-mode: false


    disable-cloaking-model-list: false
















































  xai:


    inject-x-search: false




































































































































































































































































































































#           experimental-cch-signing: false # deprecated compatibility field; CCH is generated automatically























































































































oauth:

  auth-dir: "~/.cli-proxy-api"
















































































































































  providers:
    aistudio:

      ws-auth: true


    codex:


      live-media-relay:
        enabled: false

        max-sessions: 32


        disable-private-remote-ips: false

        public-ip: ""

        udp-port-min: 0
        udp-port-max: 0














      signin-with-chatgpt-identifier: "CLIProxyAPI"










    antigravity:










      antigravity-credits: true




















multimedia:






  disable-image-generation: false













  video-result-auth-cache-ttl: "3h"


observability:
  logs:

    debug: false


    logging-to-file: false



    logs-max-total-size-mb: 0



    error-logs-max-files: 10


    request-log: false

  usage:

    usage-statistics-enabled: false




    redis-usage-queue-retention-seconds: 60


  pprof:
    enable: false
    addr: "127.0.0.1:8316"










plugins:
  enabled: false
  dir: "plugins"
































  configs:
    example:
      enabled: true
      priority: 1
      config1: true
      config2: "string"
      config3: 3
      mode: "safe"
      config-list: ["a", "b"]
      config-object:
        mode: "safe"
