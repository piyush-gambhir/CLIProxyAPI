name: Fork checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test-and-build:
    if: github.repository == 'piyush-gambhir/CLIProxyAPI'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./... -timeout 180s
      - run: python3 -m unittest discover -s scripts/tests -v
      - run: ./scripts/build-piyush.sh
