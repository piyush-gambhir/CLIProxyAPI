api-keys:
    claude:
        - keys:
            - api-key: sk-atSM...
          name: claude-1
        - base-url: https://www.example.com
          disable-cooling: false
          excluded-models:
            - claude-opus-4-5-20251101
            - claude-3-*
            - '*-thinking'
            - '*haiku*'
          headers:
            X-Custom-Header: custom-value
          keys:
            - api-key: sk-atSM...
              cloak:
                cache-user-id: true
                mode: auto
                sensitive-words:
                    - API
                    - proxy
                sensitive-words-replace:
                    Claude Code: Claude
                strict-mode: false
              experimental-cch-signing: false
              native-tool-search: false
              rebuild-mid-system-message: false
              weight: 5
          models:
            - alias: claude-sonnet-latest
              display-name: Claude Sonnet
              force-mapping: true
              is-compat: false
              max-context-length: 1048576
              name: claude-3-5-sonnet-20241022
              thinking:
                levels:
                    - max
                    - xhigh
                    - high
                    - medium
                    - low
                    - minimal
                    - none
                    - auto
          name: claude-2
          prefix: test
          proxy-url: socks5://proxy.example.com:1080
          request-retry: 3
          request-scoped-errors:
            - action: stop
              match:
                - prompt is too long
              status: 400
    codex:
        - base-url: https://www.example.com
          disable-cooling: false
          excluded-models:
            - gpt-5.1
            - gpt-5-*
            - '*-mini'
            - '*codex*'
          headers:
            X-Custom-Header: custom-value
          keys:
            - alpha-search: false
              api-key: sk-atSM...
              disable-codex-cloaking: false
              websockets: false
              weight: 5
          models:
            - alias: codex-latest
              display-name: Codex Latest
              force-mapping: true
              is-compat: false
              max-context-length: 1048576
              name: gpt-5-codex
              support-configuration-update: false
              thinking:
                levels:
                    - xhigh
                    - high
                    - medium
                    - low
          name: codex-1
          prefix: test
          proxy-url: socks5://proxy.example.com:1080
          request-retry: 3
          request-scoped-errors:
            - action: stop-and-cooldown
              match:
                - context_window_exceeded
              status: 400
    gemini:
        - base-url: https://generativelanguage.googleapis.com
          disable-cooling: false
          excluded-models:
            - gemini-2.5-pro
            - gemini-2.5-*
            - '*-preview'
            - '*flash*'
          headers:
            X-Custom-Header: custom-value
          keys:
            - api-key: AIzaSy...01
              weight: 5
            - api-key: replace-with-second-gemini-key
              disable-cooling: false
              excluded-models: []
              headers: null
              models: null
              prefix: null
              priority: null
              proxy-url: direct
              request-retry: 0
              request-scoped-errors: null
              weight: 2
          models:
            - alias: gemini-flash
              display-name: Gemini Flash
              is-compat: false
              max-context-length: 1048576
              name: gemini-2.5-flash
              thinking:
                levels:
                    - high
                    - medium
                    - low
                    - none
                    - auto
          name: gemini-1
          prefix: test
          priority: 0
          proxy-url: socks5://proxy.example.com:1080
          request-retry: 3
          request-scoped-errors:
            - action: stop
              match:
                - maximum_context_length
                - context_length_exceeded
              match-regexr:
                - maximum_context_length$
                - ^context_length_exceeded
              status: 400
        - keys:
            - api-key: AIzaSy...02
          name: gemini-2
    interactions:
        - base-url: https://generativelanguage.googleapis.com
